name: MERN CI

on:
  pull_request:
    branches: [main]

env:
  NODE_ENV: test

jobs:
  ci:
    name: Mern CI(Node ${{ matrix.node-version}})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # --------------------
      # Backend (Server)
      # --------------------

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Run server lint
        working-directory: server
        run: npm run lint

      - name: Run server tests
        working-directory: server
        env:
          DATABASE_URL: ${{secrets.DATABASE_URL}}
          JWT_SECRET: ${{secrets.JWT_SECRET}}
        run: npm test

      # --------------------
      # Frontend (Client)
      # --------------------

      - name: Install client dependancy
        working-directory: client
        run: npm ci

      - name: Run client tests
        working-directory: client
        run: npm test

      - name: Build client
        working-directory: client
        run: npm run build
